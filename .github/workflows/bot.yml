name: Bot Luminosity

on:
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 min (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:          # botão "Run workflow" para rodar na mão

permissions:
  contents: write             # para salvar o state.json no repositório

concurrency:
  group: luminosity-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Verificar HLTV e avisar por e-mail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          REMINDERS: "1440,60"   # minutos antes do jogo: 1 dia e 1 hora
        run: python bot.py

      - name: Salvar estado
        run: |
          [ -f state.json ] || exit 0
          git config user.name "luminosity-bot"
          git config user.email "luminosity-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Atualiza estado do bot" && git push)
