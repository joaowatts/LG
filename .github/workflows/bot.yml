name: Bot Luminosity

on:
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 min (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:          # botão "Run workflow" para rodar na mão
    inputs:
      teste:
        description: "Mensagem de teste (deixe vazio para rodar normal)"
        required: false
        default: ""
      destinatario:
        description: "Enviar o teste só para este e-mail (vazio = todos da lista)"
        required: false
        default: ""
      reenviar:
        description: "Reenviar aviso já enviado para o e-mail acima"
        required: false
        type: choice
        options: [nenhum, ultimo_resultado, proximo_jogo, ambos]
        default: nenhum

permissions:
  contents: write             # para salvar o state.json no repositório

concurrency:
  group: luminosity-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main                 # sempre a versão mais nova do state.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Verificar HLTV e avisar por e-mail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          REMINDERS: "1440,60"   # minutos antes do jogo: 1 dia e 1 hora
          TEST_MESSAGE: ${{ github.event.inputs.teste }}
          TEST_TO: ${{ github.event.inputs.destinatario }}
          REPLAY: ${{ github.event.inputs.reenviar }}
        run: python bot.py

      - name: Salvar estado
        run: |
          [ -f state.json ] || exit 0
          git config user.name "luminosity-bot"
          git config user.email "luminosity-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "Atualiza estado do bot"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done
          exit 1
